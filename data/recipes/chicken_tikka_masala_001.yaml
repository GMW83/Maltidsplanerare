instructions:
  - step: 1
    text: Skär kycklingen i bitar om ca 3 cm. Krydda med salt, hälften av tikka masala och hälften av koriandrpulvret.
  - step: 2
    text: Hacka lök fint. Riv ingefära och vitlök.
  - step: 3
    text: Stek kycklingen i olivolja på hög värme tills brynt runtom. Ta upp och lägg åt sidan.
  - step: 4
    text: Sänk värmen, fräs löken mjuk i ca 8 minuter.
  - step: 5
    text: Tillsätt vitlök, ingefära och resterande kryddor. Fräs 2 minuter under omrörning.
  - step: 6
    text: Tillsätt krossade tomater och låt sjuda 10 minuter.
  - step: 7
    text: Häll i grädden och lägg tillbaka kycklingen. Sjud 10 minuter tills kycklingen är genomkokt.
  - step: 8
    text: Smaka av med salt. Servera med basmatiris och färsk koriander.

