instructions:
  - step: 1
    text: Hacka gul lök och vitlök fint. Skär paprika i bitar.
  - step: 2
    text: Fräs lök och paprika i olja på medelvärme ca 5 minuter.
  - step: 3
    text: Tillsätt vitlök, spiskummin, rökt paprika och chiliflakes. Fräs 1 minut.
  - step: 4
    text: Skölj och häll i de svarta bönorna. Blanda väl och låt sjuda 5 minuter. Smaka av med salt.
  - step: 5
    text: Hacka tomater och rödlök fint till salsa. Pressa över lite lime.
  - step: 6
    text: Mosa avokadon grovt med lite limejuice och salt.
  - step: 7
    text: Värm tortillabröden i torr panna eller ugn.
  - step: 8
    text: Servera med bönfyll, salsa, avokado, gräddfil, riven ost och koriander.

