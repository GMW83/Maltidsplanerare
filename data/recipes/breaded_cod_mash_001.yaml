instructions:
  - step: 1
    text: Skala och koka potatis i saltat vatten tills mjuk, ca 20 minuter.
  - step: 2
    text: Skär morötterna i skivor och koka eller ångkoka tills mjuka, ca 10 minuter. Tina ärtor.
  - step: 3
    text: Dela torsken i portionsbitar. Salta och peppra.
  - step: 4
    text: Panera fisken i mjöl, sedan uppvispat ägg, sedan ströbröd.
  - step: 5
    text: Stek fisken i olja på medelhög värme, ca 3–4 minuter per sida tills gyllenbrun och genomkokt.
  - step: 6
    text: Häll av potatisen. Mosa med smör och mjölk. Salta och peppra.
  - step: 7
    text: Blanda majonäs, crème fraîche, dijonsenap, finhackade cornichoner, kapris och persilja till remouladsås. Smaka av med salt och peppar.
  - step: 8
    text: Servera torsk med potatismos, grönsaker, remouladsås och citronklyftor.

