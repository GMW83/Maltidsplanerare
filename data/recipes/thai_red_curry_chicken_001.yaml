instructions:
  - step: 1
    text: Skär kycklingen i bitar. Skiva paprika och dela broccoli i buketter. Dela pak choi på mitten.
  - step: 2
    text: Krossa citrongräset lätt med knivens baksida. Riv ingefära och finhacka vitlök.
  - step: 3
    text: Hetta upp olja i wok eller stor stekpanna. Fräs currypastan 1–2 minuter tills doftande.
  - step: 4
    text: Tillsätt vitlök, ingefära och citrongräs. Fräs 1 minut.
  - step: 5
    text: Tillsätt kycklingen och stek tills den fått lite färg.
  - step: 6
    text: Häll i kokosmjölken och fisksåsen. Låt sjuda 10 minuter.
  - step: 7
    text: Tillsätt paprika och broccoli. Sjud 5 minuter.
  - step: 8
    text: Tillsätt pak choi sist, sjud 2 minuter. Pressa över lime och toppa med koriander.
  - step: 9
    text: Servera med jasminris.

