    amount: 600
    unit: g
  - ingredient_id: red_curry_paste
    amount: 40
    unit: g
  - ingredient_id: coconut_milk_can
    amount: 400
    unit: ml
  - ingredient_id: bell_pepper
    amount: 2
    unit: pcs
  - ingredient_id: broccoli
    amount: 200
    unit: g
  - ingredient_id: pak_choi
    amount: 200
    unit: g
  - ingredient_id: ginger_fresh
    amount: 15
    unit: g
  - ingredient_id: garlic
    amount: 3
    unit: pcs
  - ingredient_id: lemongrass
    amount: 2
    unit: pcs
