instructions:
  - step: 1
    text: Hacka lök, vitlök och morot fint.
  - step: 2
    text: Fräs lök och morot i olivolja på medelvärme i ca 5 minuter tills mjukt.
  - step: 3
    text: Tillsätt vitlök och fräs ytterligare 1 minut.
  - step: 4
    text: Höj värmen och tillsätt köttfärsen. Bryn under omrörning tills all färg försvunnit.
  - step: 5
    text: Rör ner tomatpuré och fräs 2 minuter.
  - step: 6
    text: Tillsätt krossade tomater, buljong, oregano och lagerblad. Sänk värmen.
  - step: 7
    text: Låt sjuda utan lock i minst 30 minuter. Smaka av med salt och peppar.
  - step: 8
    text: Koka pasta enligt förpackning. Servera med riven parmesan.

